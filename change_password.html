{% extends 'base.html' %}
{% block content %}
<style>
    .form-container { max-width: 500px; margin: 40px auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 30px; }
    .form-header { font-size: 18px; font-weight: 700; color: #ffffff; border-bottom: 2px solid #334155; padding-bottom: 12px; margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; color: #94a3b8; font-size: 13px; margin-bottom: 8px; font-weight: 600; }
    .form-control { width: 100%; background: #0f172a; border: 1px solid #475569; border-radius: 8px; padding: 12px; color: #ffffff; outline: none; }
    .submit-btn { width: 100%; background: #22c55e; color: #ffffff; border: none; border-radius: 8px; padding: 12px; font-weight: 700; cursor: pointer; }
</style>

<div class="form-container">
    <div class="form-header">⚙️ تحديث كلمة المرور الشخصية لحسابك</div>
    
    {% if error %}
        <div style="background: rgba(239, 68, 68, 0.1); border-right: 4px solid #ef4444; color: #f87171; padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 15px;">⚠️ {{ error }}</div>
    {% endif %}
    {% if success %}
        <div style="background: rgba(34, 197, 94, 0.1); border-right: 4px solid #22c55e; color: #4ade80; padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 15px;">✅ {{ success }}</div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label class="form-label">كلمة المرور الحالية (القديمة)</label>
            <input type="password" name="old_password" required placeholder="••••••••" class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">كلمة المرور الجديدة المراد تفعيلها</label>
            <input type="password" name="new_password" required placeholder="••••••••" class="form-control" style="border-color: #22c55e;">
        </div>
        <button type="submit" class="submit-btn">تعديل وحفظ كلمة السر الجديدة 🔒</button>
    </form>
</div>
{% endblock %}
