{% extends 'base.html' %}
{% block content %}
<style>
    .form-container { max-width: 500px; margin: 40px auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 30px; }
    .form-header { font-size: 18px; font-weight: 700; color: #ffffff; border-bottom: 2px solid #334155; padding-bottom: 12px; margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; color: #94a3b8; font-size: 13px; margin-bottom: 8px; font-weight: 600; }
    .form-control { width: 100%; background: #0f172a; border: 1px solid #475569; border-radius: 8px; padding: 12px; color: #ffffff; outline: none; }
    .submit-btn { width: 100%; background: #eab308; color: #0f172a; border: none; border-radius: 8px; padding: 12px; font-weight: 700; cursor: pointer; }
</style>

<div class="form-container">
    <div class="form-header">🔑 إعادة تعيين كلمة مرور الموظف</div>
    <div style="margin-bottom: 20px; color: #cbd5e1; font-size: 14px;">الحساب المستهدف: <strong style="color: #facc15;">{{ user.username }}</strong></div>
    
    <form method="POST">
        <div class="form-group">
            <label class="form-label">اكتب كلمة المرور الجديدة الآمنة للموظف</label>
            <input type="password" name="new_password" required placeholder="••••••••" class="form-control" style="border-color: #eab308;">
        </div>
        <button type="submit" class="submit-btn">تأكيد التغيير وتحديث التشفير السري ⚡</button>
    </form>
</div>
{% endblock %}
