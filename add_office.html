{% extends 'base.html' %}
{% block content %}
<style>
  .form-container { max-width: 500px; margin: 40px auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
  .form-header { font-size: 18px; font-weight: 700; color: #ffffff; border-bottom: 2px solid #334155; padding-bottom: 12px; margin-bottom: 24px; text-align: right; }
  .form-group { margin-bottom: 20px; text-align: right; }
  .form-label { display: block; color: #94a3b8; font-size: 13px; margin-bottom: 8px; font-weight: 600; }
  .form-control { width: 100%; background: #0f172a; border: 1px solid #475569; border-radius: 8px; padding: 12px; color: #ffffff; outline: none; transition: border-color 0.2s; text-align: right; }
  .form-control:focus { border-color: #2563eb; }
  .submit-btn { width: 100%; background: #2563eb; color: white; border: none; border-radius: 8px; padding: 12px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .alert-error { background: rgba(239, 68, 68, 0.1); border-right: 4px solid #ef4444; color: #f87171; padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; text-align: right; }
</style>

<div class="form-container">
    <div class="form-header">🏢 قيد قطاع فرعي أو مكتب تابع جديد بالهيكل</div>
    
    {% if error %}
        <div class="alert-error">⚠️ {{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('add_office') }}">
        <div class="form-group">
            <label class="form-label">اسم المكتب أو القطاع الجديد</label>
            <input type="text" name="name" placeholder="مثال: هندسة روض الفرج فرع شبكات" required class="form-control">
        </div>
        
        <div class="form-group">
            <label class="form-label">الكود التعريفي بالإنجليزية (خالٍ من المسافات)</label>
            <input type="text" name="code" placeholder="مثال: ROA-EL-FARAG" required class="form-control" style="font-family: monospace; text-align: left; direction: ltr;">
        </div>

        <!-- حوكمة صلاحية حقل parent_id بناءً على رتبة ونوع الحساب الحالي لعام 2026 -->
        {% if session.get('role') == 'admin' %}
        <div class="form-group">
            <label class="form-label">التبعية الإدارية (اتركه فارغاً إذا كان قطاع رئيسي مستقل)</label>
            <select name="parent_id" class="form-control" style="direction: rtl;">
                <option value="">-- مكتب رئيسي عام مستقل --</option>
                {% for off in offices %}
                    <option value="{{ off.id }}">🏢 تابع لـ: {{ off.name }}</option>
                {% endfor %}
            </select>
        </div>
        {% else %}
        <div style="background: rgba(56, 189, 248, 0.1); border-right: 4px solid #38bdf8; padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 20px; color: #cbd5e1; text-align: right;">
            🔒 سيتم تسجيل هذا المكتب وتوجيه تبعيته الإدارية تلقائياً لقطاعك الجاري حالياً.
        </div>
        {% endif %}
        
        <button type="submit" class="submit-btn">⚡ اعتماد وحفظ المكتب بالهيكل</button>
    </form>
</div>
{% endblock %}
