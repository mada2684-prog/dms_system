{% extends 'base.html' %}
{% block content %}
<style>
    .form-container { max-width: 500px; margin: 30px auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 30px; }
    .form-header { font-size: 18px; font-weight: 700; color: #ffffff; border-bottom: 2px solid #334155; padding-bottom: 12px; margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; color: #94a3b8; font-size: 13px; margin-bottom: 8px; font-weight: 600; }
    .form-control { width: 100%; background: #0f172a; border: 1px solid #475569; border-radius: 8px; padding: 12px; color: #ffffff; outline: none; }
    .submit-btn { width: 100%; background: #22c55e; color: #ffffff; border: none; border-radius: 8px; padding: 12px; font-weight: 700; cursor: pointer; }
</style>

<div class="form-container">
    <div class="form-header">👤 إنشاء حساب موظف وتحديد صلاحياته</div>
    
    {% if error %}
        <div style="background: rgba(239, 68, 68, 0.1); border-right: 4px solid #ef4444; color: #f87171; padding: 12px; rounded: 6px; font-size: 13px; margin-bottom: 15px;">⚠️ {{ error }}</div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label class="form-label">اسم المستخدم الخاص بالموظف (كود الدخول بالإنجليزية)</label>
            <input type="text" name="username" required placeholder="مثال: hassan_2026" class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">كلمة المرور الأولية (تخزن مشفرة تلقائياً)</label>
            <input type="password" name="password" required placeholder="••••••••" class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">القطاع / المكتب المالي التابع له الموظف</label>
            <select name="office_id" class="form-control">
                <option value="">-- اختبر القطاع التابع له (اتركه فارغاً للأدمن) --</option>
                {% for office in offices %}
                    <option value="{{ office.id }}">🏢 {{ office.name }}</option>
                {% endfor %}
            </select>
        </div>
        <!-- ابحث عن حقل درجة الصلاحية (role) داخل ملف add_user.html واستبدل الخيارات بهذا الكود المباشر والمضمون -->
        <div class="form-group">
            <label class="form-label">درجة الصلاحية الممنوحة على المنظومة</label>
            <select name="role" class="form-control" style="direction: rtl;" required>
                <!-- 1. موظف القطاع العادي القديم -->
                <option value="user">💻 موظف قطاع عادي (قيد واستلام فقط)</option>
                
                <!-- 🔥 الخيار الجديد المضاف اليوم: صلاحية مدير القطاع للتحكم بالفروع التابعة له -->
                <option value="sub_admin">🛡️ مدير قطاع / فرع (له صلاحية قيد المكاتب التابعة)</option>
                
                <!-- 3. الأدمن العام للسيستم -->
                <option value="admin">🛠️ مدير نظام كامل الصلاحيات (Admin)</option>
            </select>
        </div>

        <button type="submit" class="submit-btn">تأكيد وبناء ملف الموظف الآمن 🔐</button>
    </form>
</div>
{% endblock %}
